# The repo owner must add the ANTHROPIC_API_KEY secret (Settings > Secrets and variables > Actions).
name: claude-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/code-review"
          claude_args: "--max-turns 5"
